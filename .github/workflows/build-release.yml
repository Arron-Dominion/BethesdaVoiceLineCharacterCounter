name: Build, test, and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore BethesdaVoiceLineCharacterCounter.slnx
      - name: Test
        run: dotnet test BethesdaVoiceLineCharacterCounter.slnx -c Release --no-restore
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0-ci.${{ github.run_number }}" }
          ./scripts/package-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/packages/*-win-x64-*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore BethesdaVoiceLineCharacterCounter.slnx
      - name: Test
        run: dotnet test BethesdaVoiceLineCharacterCounter.slnx -c Release --no-restore
      - name: Package
        shell: bash
        run: |
          version="1.0.0-ci.${{ github.run_number }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then version="${{ github.ref_name }}"; version="${version#v}"; fi
          bash ./scripts/package-linux.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: artifacts/packages/*-linux-x64.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes --verify-tag